<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>收藏到 my-wiki</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <main>
    <header><span class="mark">W</span><div><strong>收藏到 my-wiki</strong><small>微信文章正文与图片</small></div></header>
    <label>本地服务地址<input id="server" value="http://127.0.0.1:4317" spellcheck="false"></label>
    <button id="save">保存当前文章</button>
    <p id="status" role="status">请先打开一篇微信公众号文章。</p>
    <a id="open" hidden target="_blank" rel="noreferrer">在 my-wiki 中查看</a>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
