<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <title>广场协议与日本长期调整的完整因果链</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <text x="500" y="34" text-anchor="middle" font-size="23" font-weight="bold" fill="#1a1a1a">广场协议与日本长期调整：完整因果链</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#666">机制示意 · 箭头表示影响路径，不代表单一充分原因</text>

  <!-- stage labels -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <text x="105" y="95" fill="#2b579a">外部背景</text>
    <text x="300" y="95" fill="#b45309">国际协调</text>
    <text x="500" y="95" fill="#c0392b">汇率冲击</text>
    <text x="700" y="95" fill="#2b579a">国内对冲</text>
    <text x="895" y="95" fill="#c0392b">金融后果</text>
  </g>

  <!-- top chain -->
  <rect x="20" y="112" width="170" height="106" rx="10" fill="#e8f0fb" stroke="#2b579a" stroke-width="1.5"/>
  <text x="105" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">1980—1985</text>
  <text x="105" y="166" text-anchor="middle" font-size="13" fill="#444">美元升值 50%+</text>
  <text x="105" y="188" text-anchor="middle" font-size="12" fill="#555">美国贸易逆差扩大</text>
  <text x="105" y="207" text-anchor="middle" font-size="12" fill="#555">保护主义压力上升</text>

  <line x1="190" y1="165" x2="210" y2="165" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="215" y="112" width="170" height="106" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="2"/>
  <text x="300" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a4a00">1985 广场协议</text>
  <text x="300" y="166" text-anchor="middle" font-size="12" fill="#555">美、日、西德、法、英</text>
  <text x="300" y="188" text-anchor="middle" font-size="12" fill="#555">联合压低美元</text>
  <text x="300" y="207" text-anchor="middle" font-size="12" fill="#555">顺差国扩大内需</text>

  <line x1="385" y1="165" x2="405" y2="165" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="410" y="112" width="180" height="106" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.5"/>
  <text x="500" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#a93226">日元快速升值</text>
  <text x="500" y="166" text-anchor="middle" font-size="13" fill="#444">约 240 → 120 日元/美元</text>
  <text x="500" y="188" text-anchor="middle" font-size="12" fill="#555">幅度远超初始设想</text>
  <text x="500" y="207" text-anchor="middle" font-size="12" fill="#555">出口与利润承压</text>

  <line x1="590" y1="165" x2="610" y2="165" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="615" y="112" width="170" height="106" rx="10" fill="#e8f0fb" stroke="#2b579a" stroke-width="1.5"/>
  <text x="700" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">国内政策对冲</text>
  <text x="700" y="166" text-anchor="middle" font-size="13" fill="#444">贴现率 5% → 2.5%</text>
  <text x="700" y="188" text-anchor="middle" font-size="12" fill="#555">低利率维持至 1989</text>
  <text x="700" y="207" text-anchor="middle" font-size="12" fill="#555">扩大信贷与内需</text>

  <line x1="785" y1="165" x2="805" y2="165" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="810" y="112" width="170" height="106" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.5"/>
  <text x="895" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#a93226">资产价格上涨</text>
  <text x="895" y="166" text-anchor="middle" font-size="12" fill="#555">股票与土地</text>
  <text x="895" y="188" text-anchor="middle" font-size="12" fill="#555">抵押品—信贷循环</text>
  <text x="895" y="207" text-anchor="middle" font-size="12" fill="#555">泡沫逐渐扩大</text>

  <!-- domestic multipliers -->
  <text x="700" y="270" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">国内制度放大器</text>
  <line x1="700" y1="218" x2="700" y2="247" stroke="#666" stroke-width="1.8" marker-end="url(#arrow)"/>
  <g font-size="13" text-anchor="middle">
    <rect x="180" y="292" width="180" height="68" rx="9" fill="#f5f5f5" stroke="#888" stroke-dasharray="6 4"/>
    <text x="270" y="320" font-weight="bold" fill="#444">金融自由化</text>
    <text x="270" y="343" fill="#666">银行竞争加剧</text>

    <rect x="410" y="292" width="180" height="68" rx="9" fill="#f5f5f5" stroke="#888" stroke-dasharray="6 4"/>
    <text x="500" y="320" font-weight="bold" fill="#444">土地抵押信贷</text>
    <text x="500" y="343" fill="#666">资产涨 → 可借更多</text>

    <rect x="640" y="292" width="180" height="68" rx="9" fill="#f5f5f5" stroke="#888" stroke-dasharray="6 4"/>
    <text x="730" y="320" font-weight="bold" fill="#444">监管与指标盲区</text>
    <text x="730" y="343" fill="#666">消费通胀低、资产通胀高</text>
  </g>
  <line x1="360" y1="326" x2="410" y2="326" stroke="#aaa" stroke-width="1.5"/>
  <line x1="590" y1="326" x2="640" y2="326" stroke="#aaa" stroke-width="1.5"/>
  <path d="M 820 326 L 895 326 L 895 218" fill="none" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- burst chain -->
  <line x1="895" y1="360" x2="895" y2="405" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="755" y="415" width="240" height="76" rx="10" fill="#e7e6e6" stroke="#555" stroke-width="1.5"/>
  <text x="875" y="444" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">1989 后政策收紧</text>
  <text x="875" y="468" text-anchor="middle" font-size="13" fill="#555">股票与房地产泡沫破裂</text>

  <line x1="875" y1="491" x2="875" y2="530" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="690" y="540" width="305" height="106" rx="10" fill="#ececec" stroke="#555" stroke-width="1.5"/>
  <text x="842" y="570" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">长期资产负债表调整</text>
  <text x="842" y="596" text-anchor="middle" font-size="12" fill="#555">坏账确认迟缓 · 企业去杠杆</text>
  <text x="842" y="617" text-anchor="middle" font-size="12" fill="#555">通缩预期 · 财政与危机处置失误</text>
  <text x="842" y="638" text-anchor="middle" font-size="12" fill="#555">外部冲击进一步干扰复苏</text>

  <!-- conclusion box -->
  <rect x="35" y="420" width="565" height="182" rx="14" fill="#d9ead3" stroke="#38761d" stroke-width="2"/>
  <text x="318" y="454" text-anchor="middle" font-size="18" font-weight="bold" fill="#274e13">正确的因果判断</text>
  <text x="65" y="490" font-size="14" font-weight="bold" fill="#274e13">可以成立：</text>
  <text x="155" y="490" font-size="13" fill="#355e2a">广场协议是日元升值和日本政策转向的重要外部冲击。</text>
  <text x="65" y="520" font-size="14" font-weight="bold" fill="#a93226">不能成立：</text>
  <text x="155" y="520" font-size="13" fill="#555">“广场协议直接导致失去几十年”或“升值必然导致衰退”。</text>
  <text x="65" y="558" font-size="14" font-weight="bold" fill="#274e13">完整表达：</text>
  <text x="155" y="558" font-size="13" fill="#355e2a">外部汇率冲击 × 国内宽松与金融结构 × 泡沫后的危机处置</text>
  <text x="318" y="582" text-anchor="middle" font-size="13" fill="#355e2a">→ 共同决定日本长期调整。</text>

  <text x="500" y="678" text-anchor="middle" font-size="12" fill="#888">来源：纽约联储、日本银行金融研究所、日本财务省、IMF 等公开资料；具体引用见关联原始研究页</text>
</svg>
