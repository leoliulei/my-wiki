<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 620" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <title>中国 GDP 追赶美国敏感度矩阵</title>
  <text x="390" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">中国 GDP 追赶美国（名义值）敏感度矩阵</text>
  <text x="390" y="60" text-anchor="middle" font-size="13" fill="#555">美国名义增速假设 4.5%/年 · 官方 GDP 数据 · 来源：Goldman Sachs Global Investment Research（Exhibit 4，报告转述）</text>

  <!-- matrix geometry -->
  <!-- x labels: cols 2..7 ; y labels: rows 0..6 -->
  <g font-size="15" fill="#1a1a1a" text-anchor="middle">
    <text x="172" y="98">2%</text>
    <text x="264" y="98">3%</text>
    <text x="356" y="98">4%</text>
    <text x="448" y="98">5%</text>
    <text x="540" y="98">6%</text>
    <text x="632" y="98">7%</text>
  </g>
  <g font-size="15" fill="#1a1a1a" text-anchor="end">
    <text x="120" y="136">0%</text>
    <text x="120" y="188">1%</text>
    <text x="120" y="240">2%</text>
    <text x="120" y="292">3%</text>
    <text x="120" y="344">4%</text>
    <text x="120" y="396">5%</text>
    <text x="120" y="448">6%</text>
  </g>
  <text x="30" y="300" text-anchor="middle" font-size="14" fill="#333" transform="rotate(-90 30 300)">人民币对美元年化升值（%）</text>
  <text x="390" y="512" text-anchor="middle" font-size="14" fill="#333">中国年化名义增速（%）</text>

